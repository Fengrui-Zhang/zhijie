<style>

lay:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:24px}.tabs button{border:0;border-radius:0;background:none;padding:8px 0 12px;color:var(--muted)}.tabs button.selected{border-bottom:2px solid var(--gold);color:var(--ink);font-weight:600}.report{display:grid;grid-template-columns:1fr 210px;gap:20px}.report p{color:#555248;line-height:1.9}.report article h3{margin:25px 0 7px}.report aside{font-size:13px}.report aside button{display:block;width:100%;margin-top:10px;text-align:left}.citation{border-left:3px solid #c7ab76;padding:12px 16px;background:#f8f3e9;margin:20px 0}.chat{display:flex;flex-direction:column;min-height:510px}.bubble{max-width:86%;padding:18px 22px;border-radius:17px;background:var(--paper);border:1px solid var(--line);margin-bottom:18px}.bubble.user{align-self:flex-end;background:#eae4d7;border:0}.bubble p{color:#514e44}.tool{font-size:12px;color:#69785e;border-top:1px solid var(--line);padding-top:10px;margin-top:14px}.composer{margin-top:auto;background:var(--paper);border:1px solid #d1c7b3;border-radius:19px;padding:12px 16px;box-shadow:0 8px 28px #43341809}.composer textarea{display:block;width:100%;resize:vertical;min-height:65px;max-height:150px;border:0;background:none;padding:10px 0;outline:none;font-size:16px}.composer .row{display:flex;align-items:center;justify-content:space-between;gap:8px}.composer button{padding:7px 11px;font-size:12px}.refs{display:flex;gap:6px;flex-wrap:wrap}.settings{display:grid;grid-template-columns:155px 1fr;gap:24px}.settingsnav button{display:block;width:100%;text-align:left;margin:0 0 6px;border:0;background:none}.settingsnav button.selected{background:#e9e3d6}.setting{display:flex;gap:15px;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting p{font-size:12px;margin:4px 0 0}.toggle{width:43px;height:26px;border-radius:20px;position:relative;padding:0;background:#928976;border:0;flex-shrink:0}.toggle:after{content:'';position:absolute;width:20px;height:20px;background:white;border-radius:50%;left:3px;top:3px;transition:transform .18s}.toggle[aria-checked=true]{background:#74623f}.toggle[aria-checked=true]:after{transform:translateX(17px)}.bottomnav{display:none}.note{color:#69645a;font-size:12px;margin-top:24px;border-top:1px dashed #d5cbb9;padding-top:16px}.empty{grid-column:1/-1;padding:40px;text-align:center}.phone{max-width:390px}.phone .layout{grid-template-columns:1fr}.phone .sidebar{display:none}.phone .main{padding:25px 18px}.phone .top{height:58px;padding:0 18px}.phone .brand{font-size:20px}.phone .top small{display:none}.phone .heading{gap:8px;align-items:flex-start}.phone h1{font-size:24px}.phone .heading>button{font-size:12px;white-space:nowrap;padding:9px 11px}.phone .cards{grid-template-columns:1fr}.phone .list .card{display:block}.phone .list .pillars{margin:14px 0}.phone .list .cardfoot{display:flex}.phone .report{grid-template-columns:1fr}.phone .report aside{display:block;grid-row:1}.phone .report aside button{display:inline-block;width:auto;margin:8px 5px 0 0}.phone .report aside p{font-size:12px}.phone .tabs{gap:18px;font-size:13px;white-space:nowrap}.phone .settings{grid-template-columns:1fr}.phone .settingsnav{display:flex;overflow:auto;gap:4px}.phone .settingsnav button{white-space:nowrap;width:auto;padding:7px 13px}.phone .bubble{max-width:96%}.phone .chat{min-height:480px}.phone .bottomnav{display:flex;background:var(--paper);border-top:1px solid var(--line);padding:9px 8px 14px;justify-content:space-around}.bottomnav button{border:0;font-size:12px;padding:8px 12px}.phone .toolbar{gap:10px}.phone .search{width:100%}.phone .summarybar{flex-wrap:wrap;gap:7px 14px}.phone .pillars{gap:20px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#292820;color:#fff9eb;padding:12px 22px;border-radius:14px;box-shadow:0 8px 30px #0002;z-index:10;max-width:90vw}dialog{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:22px;max-width:440px;width:calc(100% - 32px);padding:26px}dialog::backdrop{background:#211e1840;backdrop-filter:blur(3px)}dialog button{margin:8px 5px 0 0}.dialoghead{display:flex;justify-content:space-between;align-items:center}.dialoghead h2{margin:0}a{color:var(--gold)}@media(max-width:750px){.review{padding:16px;flex-wrap:wrap}.review .switch{margin-left:auto}.frame{border-radius:0;margin-bottom:0}.layout{grid-template-columns:1fr}.sidebar{display:none}.main{padding:24px 18px}.cards{grid-template-columns:1fr}.report,.settings{grid-template-columns:1fr}.report aside{display:block;grid-row:1}.report aside button{display:inline-block;width:auto;margin-right:6px}.settingsnav{display:flex;overflow:auto}.settingsnav button{white-space:nowrap;width:auto}.list .card{display:block}.bottomnav{display:flex;justify-content:space-around;background:var(--paper)}.review small{font-size:11px}.heading h1{font-size:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<header class="review"><div><strong>已撤回 · 此预览不作为实施方向</strong><small>按用户要求：保留原页面，只优化现有交互。请查看修正版方案。</small></div><div class="switch"><button class="active" id="desktop">桌面</button><button id="mobile">手机</button><a href="README.md">完整方案 ↗</a></div></header>
<div class="frame" id="frame"><div class="top"><div class="brand">☯ 元分 · 智解</div><small>我的工作台</small><button onclick="showToast('账户菜单位置示意')">示例账户 ⌄</button></div><div class="layout"><aside class="sidebar"><small>命理与运势</small><button data-page="cases">命例库 <span>4</span></button><button data-page="analysis">分析结果 <span>↗</span></button><small>工作区</small><button data-page="chat">问智解 <span>✧</span></button><button data-page="settings">设置 <span>⚙</span></button><div class="meta">此处仅呈现四个代表页面。<br>完整导航与全站覆盖见方案。</div></aside><main class="main" id="main"></main></div><nav class="bottomnav" aria-label="预览导航"><button data-page="cases">命例</button><button data-page="analysis">分析</button><button data-page="chat">问智解</button><button data-page="settings">设置</button></nav></div>
<dialog id="dialog"><div class="dialoghead"><h2 id="dialogtitle"></h2><button onclick="document.querySelector('dialog').close()" aria-label="关闭面板">×</button></div><div id="dialogbody"></div></dialog><div id="toast" role="status" class="toast" hidden></div>
<script>
const main=document.querySelector('#main'),frame=document.querySelector('#frame');let page='cases',view='cards',toastTimer;
const caseData=[['示例命例一','八字','乾造 · 公历 1992 年','甲子　丙寅　戊辰　庚申','今天更新'],['示例命例二','紫微','坤造 · 公历 1994 年','命宫　身宫　四化','昨天更新'],['示例命例三','八字','乾造 · 公历 1988 年','乙丑　丁卯　己巳　辛酉','3 天前更新'],['示例命例四','八字','坤造 · 公历 1996 年','丙寅　戊辰　庚午　壬戌','5 天前更新']];
function showToast(text){let t=document.querySelector('#toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2800)}
function panel(title,body){document.querySelector('#dialogtitle').textContent=title;document.querySelector('#dialogbody').innerHTML=body;document.querySelector('#dialog').showModal()}
function caseMenu(){panel('命例操作',`<p>正式版接入已有编辑与删除流程。</p><button onclick="showToast('修改入口示意')">修改资料</button><button onclick="showToast('删除仍需明确确认')">删除命例</button>`)}
function newCaseMenu(){panel('新建命例',`<p>选择排盘类型，随后填写出生资料。</p><button onclick="showToast('进入八字表单的交互示意')">四柱八字 →</button><button onclick="showToast('进入紫微表单的交互示意')">紫微斗数 →</button>`)}
function filterMenu(){panel('筛选命例',`<p>正式版可按类型与更新时间组合筛选，并显示已选条件。</p><button onclick="showToast('八字筛选条件示意')">八字</button><button onclick="showToast('紫微筛选条件示意')">紫微</button>`)}
function note(text){return `<div class="note">方案说明 · ${text}</div>`}
function cards(query=''){document.querySelector('#casecards').innerHTML=caseData.filter(x=>x.join('').includes(query)).map((x,i)=>`<article class="card"><div><div class="cardtop"><h3>${x[0]}</h3><button class="dots" aria-label="${x[0]}更多操作" onclick="caseMenu()">⋯</button></div><p style="font-size:12px">${x[2]}</p><span class="pill">${x[1]}</span></div><div class="pillars">${x[3]}</div><div class="cardfoot"><span>${x[4]}</span><button onclick="render('analysis')">查看命盘 →</button></div></article>`).join('')||'<div class="empty">没有匹配的示例命例，试试其他关键词。</div>';}
function render(next){window.scrollTo({top:0,behavior:'instant'});page=next;document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});
if(page==='cases'){main.innerHTML=`<div class="eyebrow">CASE LIBRARY / 命例管理</div><div class="heading"><div><h1>把每一次解读，留在这里。</h1><p>搜索、整理并继续已有命例。</p></div><button class="primary" onclick="newCaseMenu()">＋ 新建命例</button></div><div class="toolbar"><input class="search" aria-label="搜索示例命例" placeholder="搜索姓名、类型或出生信息" id="search"><div class="seg" aria-label="显示方式"><button id="cardsview" class="selected">卡片</button><button id="listview">列表</button></div><button onclick="filterMenu()">筛选 ⌄</button></div><div id="casecards" class="cards"></div>${note('Animated Collection + Create Menu + Smooth Dropdown。两种视图使用同一批记录；新增搜索与就近操作。')}`;cards();document.querySelector('#search').oninput=e=>cards(e.target.value);document.querySelector('#cardsview').onclick=()=>setView('cards');document.querySelector('#listview').onclick=()=>setView('list');setView(view)}
if(page==='analysis'){main.innerHTML=`<div class="eyebrow">READING / 解读工作区</div><div class="heading"><div><h1>示例命例一</h1><p>出生信息、历法与校准状态在同一处确认。</p></div><button onclick="render('cases')">返回命例库</button></div><div class="tabs" aria-label="解读分页"><button onclick="showToast('专业盘面保留原有几何结构')">专业排盘</button><button onclick="showToast('风水时间层级与主题筛选示意')">紫微风水</button><button class="selected">AI 解读</button><button onclick="showToast('笔记将接入真实保存与错误反馈')">断事笔记</button></div><div class="summarybar"><strong>整体解读</strong><span class="pill">已有结果</span><span class="muted">版本与更新时间</span></div><div class="report"><article class="card"><span class="eyebrow">阅读结构示意</span><h2 style="margin-top:8px">先看结论，再查看依据。</h2><p>这里呈现报告的视觉层级。正式页面沿用真实分析结果，保持长文可读、可复制，也能继续追问。</p><div class="citation">关键结论使用适度强调；来源与说明在附近呈现。页面切换时，正文位置保持稳定。</div><h3>01 · 当前重点</h3><p>把摘要、分项分析和建议划分为清晰段落。减少重叠卡片，给正文更多呼吸空间。</p><h3>02 · 分析依据</h3><p>专业术语、命盘数据和出处保持原有语义，用户需要时再展开更详细的信息。</p></article><aside><h3>报告操作</h3><button onclick="showToast('复制操作将以真实剪贴板结果显示状态')">复制全文 ↗</button><button onclick="showToast('保留现有导出内容与格式')">导出报告 ↓</button><button onclick="showToast('版本入口示意')">查看版本 ⌄</button><p style="margin-top:25px">重新生成单独呈现额度消耗，避免误触。</p><button onclick="showToast('本预览不发起AI请求、不消耗额度')">重新生成 · 1点</button></aside></div>${note('Discrete Tabs + Dynamic Toolbar。专业盘面保持稳定；AI 的读取、生成、完成与失败分别呈现。')}`}
if(page==='chat'){main.innerHTML=`<div class="eyebrow">ASK ZHIJIE / 问智解</div><div class="heading"><div><h1>问题与资料，一起交给智解。</h1><p>引用命例后，继续你的问题。</p></div></div><div class="chat"><div class="bubble user">结合示例命例，帮我整理接下来需要关注的事情。</div><div class="bubble"><h3>我会先核对已引用的资料。</h3><p>这里展示消息层次与工具状态的位置。完整上下文选择放进独立面板，让手机上有更多空间阅读对话。</p><div class="tool">✓ 引用资料已载入 · 交互示意</div></div><div class="composer"><div class="refs"><span class="pill">命例 · 示例命例一</span><span class="pill">知识库已开启</span></div><textarea aria-label="预览问题输入" placeholder="继续输入你的问题…"></textarea><div class="row"><button onclick="panel('引用资料','<p>面板中搜索命例或历史会话。关闭后，输入框保留已选资料摘要。</p><input class=search aria-label=搜索资料 placeholder=搜索命例或会话><p><span class=pill>已选择：示例命例一</span></p>')">＋ 添加资料</button><button class="primary" onclick="showToast('这是方案预览，内容不会发送；正式版仅在真实成功后清空草稿。')">发送 ↑</button></div></div></div>${note('Prompt Box + 底部资料面板。输入支持中文组合态，错误保留草稿，AI状态沿用真实请求与工具回报。')}`}
if(page==='settings'){main.innerHTML=`<div class="eyebrow">PREFERENCES / 工作区设置</div><div class="heading"><div><h1>让智解适合你的习惯。</h1><p>偏好、显示和账号信息各归其位。</p></div></div><div class="settings"><nav class="settingsnav" aria-label="设置分类"><button onclick="showToast('账户信息分类示意')">我的账户</button><button class="selected">常规</button><button onclick="showToast('回答与图表偏好分类示意')">个性化</button><button onclick="showToast('帮助分类示意')">帮助</button><button onclick="showToast('安全设置分类示意')">安全</button></nav><section class="card"><h2>界面与记录</h2><div class="setting"><div><h3>历史记录侧栏</h3><p>在宽屏工作区展示最近分析。</p></div><button class="toggle" role="switch" aria-label="历史记录侧栏示意" aria-checked="true" onclick="toggle(this)"></button></div><div class="setting"><div><h3>默认参考知识库</h3><p>新问题沿用所选偏好。</p></div><button class="toggle" role="switch" aria-label="知识库示意" aria-checked="true" onclick="toggle(this)"></button></div><div class="setting"><div><h3>手机底部导航</h3><p>保留现有入口选择与排序能力。</p></div><button onclick="panel('自定义导航','<p>正式版继续使用已有偏好数据与导航设置。</p>')">调整 →</button></div><p style="font-size:12px;margin-top:18px;color:#69785e">预览中的操作仅影响本页，不会保存到账号。</p></section></div>${note('紧凑分类 + Theme Toggle 的开关反馈 + 真实保存状态。所有控件最终连接现有设置，不额外新增深色模式。')}`}}
function setView(v){view=v;document.querySelector('#casecards').classList.toggle('list',v==='list');document.querySelector('#cardsview').classList.toggle('selected',v==='cards');document.querySelector('#listview').classList.toggle('selected',v==='list')}
function toggle(el){el.setAttribute('aria-checked',el.getAttribute('aria-checked')!=='true');showToast('预览偏好已切换，未写入真实账号')}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>render(b.dataset.page));document.querySelector('#mobile').onclick=()=>{frame.classList.add('phone');document.querySelector('#mobile').classList.add('active');document.querySelector('#desktop').classList.remove('active')};document.querySelector('#desktop').onclick=()=>{frame.classList.remove('phone');document.querySelector('#desktop').classList.add('active');document.querySelector('#mobile').classList.remove('active')};render('cases');
</script></html>
